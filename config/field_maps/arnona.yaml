  #   4. Replace the placeholder jotform_id values below with the real ones.
  #   5. Set verified: true for each confirmed field.
  #   6. Restart the server.
  #
  # Until these IDs are configured, the business mapper falls back to the raw
  # section data (customer / outgoing / partner / landlord sections above).
  # The pipeline works correctly either way.
