# ═══════════════════════════════════════════════════════════════════════════
# Field Map — PRODUCTION MAIN FORM
# form: "NEW MAIN FORM - 3.1 - Step 1 of 7"  (form_id 250201745267957)
#
# v0.8.2 MIGRATION: real production field IDs restored from the v0.3 mapping
# (git c42b802:app/parsers/field_maps/main_form.py) and verified against the
# real submission 6568173356277189497 (MZK6852, 2026-06-09).
#
# verified: true  = ID confirmed against a real production payload
# verified: false = PLACEHOLDER — production ID not yet known; the label keeps
#                   downstream consumers (rules, mapper) working; the field
#                   simply parses empty until the real ID is filled in.
#
# HOW TO VERIFY REMAINING PLACEHOLDERS:
#   1. Receive a real submission that fills the field (e.g. a רמת גן transfer
#      for arnona account numbers, a two-tenant lease for partner fields).
#   2. GET /discover/{submission_id} — shows every raw field ID and value.
#   3. Replace the placeholder jotform_id, set verified: true, restart.
#
# LABELS ARE A CONTRACT: business_mapper.py, rules.py, summary.py and
# conditional_logic.py read these exact Hebrew labels. Change IDs freely;
# never change labels without checking those consumers.
# ═══════════════════════════════════════════════════════════════════════════

