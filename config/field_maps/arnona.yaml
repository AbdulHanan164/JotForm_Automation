#
# OR: POST /admin/sync/251955479892982  (requires JOTFORM_API_KEY in .env)
#     This auto-imports field IDs from the JotForm API and shows a YAML stub
#     you can paste here to replace the placeholders below.
#
# NAMING CONVENTION:
#   label:   The Hebrew key used INSIDE the section dict in parsed data.
#            Must match exactly what summary.py and rules.py expect.
#            Example: "עיר", "שם_פרטי", "תעודת_זהות"
#   section: One of: basic | customer | partner | outgoing | landlord |
#                    property | arnona | water | documents | payment | system
#   type:    text | date | phone | email | id_num | file | signature | bool | multi | select
# ═══════════════════════════════════════════════════════════════════════════════

