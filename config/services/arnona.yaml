# ── REVIEW TEMPLATE ───────────────────────────────────────────────────────────
# What the operator sees in the review dashboard

review:
  display_fields:
    - section: "פרטי נכס"
      fields: ["עיר", "רחוב", "מספר בית", "דירה", "תאריך כניסה"]
    - section: "דייר נכנס"
      fields: ["שם פרטי (דייר נכנס)", "שם משפחה (דייר נכנס)",
               "טלפון (דייר נכנס)", "מייל (דייר נכנס)"]
    - section: "דייר יוצא"
      fields: ["שם פרטי (דייר יוצא)", "שם משפחה (דייר יוצא)",
               "טלפון (דייר יוצא)", "מייל (דייר יוצא)"]
    - section: "שירות ארנונה"
      fields: ["מספר זיהוי נכס", "מספר לקוח", "מספר חשבון תושב",
               "מספר חשבון לקוח"]
    - section: "שירות מים"
      fields: ["מספר לקוח מים", "מספר נכס מים"]

  checklist:
    - "חוזה שכירות — שמות הדיירים תואמים?"
    - "תאריכי שכירות סבירים?"
    - "מספרי חשבון מוזנים נכון?"
    - "כל מסמכים נדרשים צורפו?"
    - "פרטי בעל הבית אושרו?"


