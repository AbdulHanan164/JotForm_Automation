    note: "Primary validation document — names/dates extracted"

  - jotform_id: q92_idCopy92
    label: "צילום תעודת זהות"
    section: documents
    type: file
    required: always
    document_type: id_document

  - jotform_id: q93_arnonaBill93
    label: "שובר ארנונה"
    section: documents
    type: file
    required: conditional
    document_type: arnona_bill
    note: "Required when שירות includes ארנונה"

  - jotform_id: q94_waterBill94
    label: "שובר מים"
    section: documents
    type: file
    required: conditional
    document_type: water_bill
    note: "Required when שירות includes מים"

  # ── System / Internal ──────────────────────────────────────────────────────
  - jotform_id: q101_submissionRef
    label: "מספר פנייה"
    section: system
    type: text
    required: never
    note: "Auto-generated reference number MZK-XXXX"


# ── REQUIRED DOCUMENTS ────────────────────────────────────────────────────────

required_documents:
  - id: lease_contract
    label: "חוזה שכירות"
    jotform_field: q91_lease91
    required: always
    missing_reason: "נדרש לאימות שמות הדיירים ותאריכי השכירות"
    extraction: lease          # links to documents/lease_analyzer

  - id: id_document
    label: "צילום תעודת זהות"
    jotform_field: q92_idCopy92
    required: always
    missing_reason: "נדרש לאימות זהות הדייר הנכנס"
    extraction: id_card

  - id: arnona_bill
    label: "שובר ארנונה"
    jotform_field: q93_arnonaBill93
    required: conditional
    condition: "שירות contains ארנונה"
    missing_reason: "נדרש לאימות מספרי החשבון בעירייה"
    extraction: arnona_bill

  - id: water_bill
    label: "שובר מים"
    jotform_field: q94_waterBill94
    required: conditional
    condition: "שירות contains מים"
    missing_reason: "נדרש לאימות מספרי חשבון מים"
    extraction: water_bill


# ── CONDITIONAL RULES ─────────────────────────────────────────────────────────
# These mirror the JotForm conditional logic rules exactly.
# Auto-imported via POST /admin/sync/251955479892982 (supplements these).
#
# logic: all = AND, any = OR

conditional_rules:

  - id: arnona_ramat_gan_hide
    note: "Hide arnona account numbers in Ramat Gan (city handles it internally)"
    logic: all
    conditions:
      - field: "שירות"
        operator: contains
        value: "ארנונה"
      - field: "עיר"
        operator: equals
        value: "רמת גן"
    action: hide
    targets:
      - "מספר זיהוי נכס"
      - "מספר לקוח"
      - "מספר חשבון תושב"
      - "מספר חשבון לקוח"

  - id: water_ramat_gan_hide
    note: "Hide water section in Ramat Gan water service (different process)"
    logic: all
    conditions:
      - field: "שירות"
        operator: contains
        value: "מים"
      - field: "עיר"
        operator: equals
        value: "רמת גן"
    action: hide
    targets:
      - "מספר לקוח מים"
      - "מספר נכס מים"
      - "ועד בית"

  - id: water_customer_autofill
    note: "Auto-fill water customer number from arnona customer number"
    logic: any
    conditions:
      - field: "עיר"
        operator: equals
        value: "רמת גן"
      - field: "עיר"
        operator: equals
        value: "אשדוד"
    action: autofill
    targets:
      - "מספר לקוח מים"
    autofill_source: "מספר לקוח"

  - id: water_asset_autofill
    note: "Auto-fill water asset number from arnona asset number"
    logic: any
    conditions:
      - field: "עיר"
        operator: equals
        value: "רמת גן"
      - field: "עיר"
        operator: equals
        value: "אשדוד"
    action: autofill
    targets:
      - "מספר נכס מים"
    autofill_source: "מספר נכס"

  - id: company_fields_hide_private
    note: "Hide company fields for private persons"
    logic: all
    conditions:
      - field: "סוג מגיש"
        operator: equals
        value: "פרטי"
    action: hide
    targets:
      - "שם חברה"
      - "שם נציג"
      - "מספר ח.פ"

  - id: personal_id_hide_company
    note: "Hide personal ID for companies"
    logic: all
    conditions:
      - field: "סוג מגיש"
        operator: equals
        value: "חברה"
    action: hide
    targets:
      - "תעודת זהות (דייר נכנס)"


# ── MISSING INFO RULES ────────────────────────────────────────────────────────
# When a required field is empty, what reason do we show the operator?

missing_info_rules:

  - field: "עיר"
    severity: error
    reason: "חסרה עיר — לא ניתן לבדוק כללי תנאי"

  - field: "תאריך כניסה"
    severity: error
    reason: "חסר תאריך כניסה — נדרש להכנת מכתב בקשה"

  - field: "שם פרטי (דייר נכנס)"
    severity: error
    reason: "חסר שם הדייר הנכנס"

  - field: "שם משפחה (דייר נכנס)"
    severity: error
    reason: "חסר שם משפחה הדייר הנכנס"

  - field: "טלפון (דייר נכנס)"
    severity: error
    reason: "חסר טלפון — לא ניתן ליצור קשר"

  - field: "תעודת זהות (דייר נכנס)"
    severity: error
    reason: "חסרה תעודת זהות — נדרשת לרשות המקומית"

  - field: "רחוב"
    severity: error
    reason: "חסרה כתובת הנכס"

  - field: "מספר בית"
    severity: error
    reason: "חסר מספר בית"

  - field: "דירה"
    severity: error
    reason: "חסר מספר דירה"

  - field: "שם פרטי (דייר יוצא)"
    severity: error
    reason: "חסר שם הדייר היוצא"

  - field: "שם משפחה (דייר יוצא)"
    severity: error
    reason: "חסר שם משפחה הדייר היוצא"

  - field: "טלפון (דייר יוצא)"
    severity: error
    reason: "חסר טלפון דייר יוצא"

  - field: "שם פרטי (בעל הבית)"
    severity: warning
    reason: "חסר שם בעל הבית (מומלץ לאימות חוזה)"

  - field: "שם משפחה (בעל הבית)"
    severity: warning
    reason: "חסר שם משפחה של בעל הבית"


# ── VALIDATION RULES ─────────────────────────────────────────────────────────
# Cross-field and cross-document consistency checks.

validation_rules:

  - id: duplicate_tenant_names
    severity: warning
    label: "שמות דיירים זהים"
    description: "שם הדייר הנכנס זהה לשוכר השני"
    check_fields: ["שם פרטי (דייר נכנס)", "שם משפחה (דייר נכנס)",
                   "שם פרטי (שוכר שני)", "שם משפחה (שוכר שני)"]
    check: same_name_customer_partner
    suggestion: "בדוק אם אכן מדובר באותו אדם"

  - id: tenant_name_not_in_lease
    severity: error
    label: "שם דייר לא מופיע בחוזה"
    description: "שם הדייר הנכנס שנמסר בטופס לא נמצא בחוזה השכירות"
    check: customer_name_in_lease
    requires_document: lease_contract
    suggestion: "בקש עותק חוזה עדכני או הבהרה מהלקוח"

  - id: outgoing_email_none
    severity: info
    label: "מייל דייר יוצא חסר"
    description: "הלקוח ציין שאין מייל לדייר היוצא"
    check: outgoing_email_is_text_none
    suggestion: "אפשר להמשיך — יש לצרף הערה בפנייה לעירייה"

  - id: partner_phone_no_id
    severity: warning
    label: "שוכר שני ללא תעודת זהות"
    description: "קיים טלפון לשוכר שני אך לא צורפה תעודת זהות"
    check_fields: ["טלפון (שוכר שני)", "תעודת זהות (שוכר שני)"]
    check: partner_phone_missing_id
    suggestion: "בקש תעודת זהות של שוכר שני לאימות מלא"

  - id: lease_date_mismatch
    severity: warning
    label: "תאריך שונה מחוזה"
    description: "תאריך הכניסה בטופס אינו תואם את תאריך תחילת השכירות בחוזה"
    check: move_in_date_matches_lease
    requires_document: lease_contract
    suggestion: "בדוק מול הלקוח — ייתכן טעות הקלדה"

  - id: arnona_bill_account_mismatch
    severity: error
    label: "מספר חשבון לא תואם שובר"
    description: "מספר חשבון ארנונה בטופס שונה ממה שמופיע בשובר"
    check: arnona_account_matches_bill
    requires_document: arnona_bill
    suggestion: "בקש שובר עדכני מהלקוח"


