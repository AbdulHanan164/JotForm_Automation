  # ── Outgoing Tenant ────────────────────────────────────────────────────────
  - jotform_id: q41_outFirst41
    label: "שם פרטי (דייר יוצא)"
    section: outgoing
    type: text
    required: always

  - jotform_id: q42_outLast42
    label: "שם משפחה (דייר יוצא)"
    section: outgoing
    type: text
    required: always

  - jotform_id: q43_outPhone43
    label: "טלפון (דייר יוצא)"
    section: outgoing
    type: phone
    required: always

  - jotform_id: q44_outEmail44
    label: "מייל (דייר יוצא)"
    section: outgoing
    type: email
    required: never
    note: "May be 'אין' — detected as INFO and noted in email"

  # ── Landlord ───────────────────────────────────────────────────────────────
  - jotform_id: q51_llFirst51
    label: "שם פרטי (בעל הבית)"
    section: landlord
    type: text
    required: always

  - jotform_id: q52_llLast52
    label: "שם משפחה (בעל הבית)"
    section: landlord
    type: text
    required: always

  - jotform_id: q53_llPhone53
    label: "טלפון (בעל הבית)"
    section: landlord
    type: phone
    required: always

  - jotform_id: q54_llEmail54
    label: "מייל (בעל הבית)"
    section: landlord
    type: email
    required: never

  # ── Property ───────────────────────────────────────────────────────────────
  - jotform_id: q61_street61
    label: "רחוב"
    section: property
    type: text
    required: always

  - jotform_id: q62_houseNum62
    label: "מספר בית"
    section: property
    type: text
    required: always

  - jotform_id: q63_apt63
    label: "דירה"
    section: property
    type: text
    required: always

  - jotform_id: q64_floor64
    label: "קומה"
    section: property
    type: text
    required: never

  - jotform_id: q65_entrance65
    label: "כניסה"
    section: property
    type: text
    required: never

  # ── Arnona Account Numbers ─────────────────────────────────────────────────
  - jotform_id: q71_propertyId71
    label: "מספר זיהוי נכס"
    section: arnona
    type: text
    required: conditional
    note: "Hidden when city=רמת גן — see rule arnona_ramat_gan_hide"

  - jotform_id: q72_customerId72
    label: "מספר לקוח"
    section: arnona
    type: text
    required: conditional
    note: "Hidden when city=רמת גן"

  - jotform_id: q73_residentAccount73
    label: "מספר חשבון תושב"
    section: arnona
    type: text
    required: conditional
    note: "Hidden when city=רמת גן"

  - jotform_id: q74_customerAccount74
    label: "מספר חשבון לקוח"
    section: arnona
    type: text
    required: conditional
    note: "Hidden when city=רמת גן"

  - jotform_id: q75_assetNum75
    label: "מספר נכס"
    section: arnona
    type: text
    required: never

  # ── Water Account Numbers ──────────────────────────────────────────────────
  - jotform_id: q81_waterCustomer81
    label: "מספר לקוח מים"
    section: water
    type: text
    required: conditional
    note: "Hidden for water service in רמת גן; auto-filled from מספר לקוח for רמת גן/אשדוד"

  - jotform_id: q82_waterAsset82
    label: "מספר נכס מים"
    section: water
    type: text
    required: conditional
    note: "Auto-filled from מספר נכס for רמת גן/אשדוד"

