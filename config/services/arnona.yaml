# ═══════════════════════════════════════════════════════════════════════════════
# Service: העברת חשבון ארנונה  (Arnona Account Transfer)
# Company: מה זה קל  |  058-773-2700  |  docs@mazekal.co.il
#
# HOW TO USE THIS FILE:
#   1. Run GET /discover/{submission_id} to get real JotForm field IDs.
#   2. Replace the jotform_id placeholders below with the real IDs.
#   3. Run POST /admin/sync/251955479892982 to import JotForm conditions.
#   4. Restart the server — no code changes needed.
#
# FIELD ID NOTE:
#   All jotform_id values below are placeholders (e.g. q4_cityName4).
#   They must be verified against real JotForm submissions.
#   Use GET /discover/{submission_id} after your first real webhook.
# ═══════════════════════════════════════════════════════════════════════════════

service:
  name: arnona_transfer
  display_name: "העברת חשבון ארנונה"
  form_id: "251955479892982"
  version: "0.5.0"

  # Google Sheet for this service (human review dashboard)
  google_sheet_id: ""         # TODO: fill in after creating the sheet
  google_sheet_tab: "הגשות"

  # Contact info for email templates
  company_name:  "מה זה קל"
  company_phone: "058-773-2700"
  company_email: "docs@mazekal.co.il"


# ── FIELDS ────────────────────────────────────────────────────────────────────
# sections: basic | customer | partner | outgoing | landlord | property |
#           arnona | water | documents | payment | system
# required: always | never | conditional
# type:     text | phone | email | date | file | select | multi | signature

fields:

  # ── Basic / Request Info ───────────────────────────────────────────────────
  - jotform_id: q4_cityName4
    label: "עיר"
    section: basic
    type: text
    required: always
    note: "City drives most conditional logic — must be captured first"

  - jotform_id: q5_services5
    label: "שירות"
    section: basic
    type: multi
    required: always
    options: ["ארנונה", "מים"]
    note: "Which services to transfer: ארנונה and/or מים"

  - jotform_id: q6_moveInDate
    label: "תאריך כניסה"
    section: basic
    type: date
    required: always

  - jotform_id: q7_moveOutDate
    label: "תאריך יציאה"
    section: basic
    type: date
    required: never
    note: "Used for outgoing tenant's exit date"

  # ── Incoming Customer ──────────────────────────────────────────────────────
  - jotform_id: q21_firstName21
    label: "שם פרטי (דייר נכנס)"
    section: customer
    type: text
    required: always

  - jotform_id: q22_lastName22
    label: "שם משפחה (דייר נכנס)"
    section: customer
    type: text
    required: always

  - jotform_id: q23_phone23
    label: "טלפון (דייר נכנס)"
    section: customer
    type: phone
    required: always

  - jotform_id: q24_email24
    label: "מייל (דייר נכנס)"
    section: customer
    type: email
    required: always

  - jotform_id: q25_idNumber25
    label: "תעודת זהות (דייר נכנס)"
    section: customer
    type: text
    required: always
    note: "Hidden for companies — see conditional rules"

  - jotform_id: q26_personType26
    label: "סוג מגיש"
    section: customer
    type: select
    required: always
    options: ["פרטי", "חברה"]

  - jotform_id: q27_companyName27
    label: "שם חברה"
    section: customer
    type: text
    required: conditional
    note: "Visible only when סוג מגיש = חברה"

  - jotform_id: q28_repName28
    label: "שם נציג"
    section: customer
    type: text
    required: conditional
    note: "Visible only when סוג מגיש = חברה"

  - jotform_id: q29_bnNumber29
    label: "מספר ח.פ"
    section: customer
    type: text
    required: conditional
    note: "Visible only when סוג מגיש = חברה"

  # ── Partner / Second Tenant ────────────────────────────────────────────────
  - jotform_id: q31_partnerFirst31
    label: "שם פרטי (שוכר שני)"
    section: partner
    type: text
    required: never

  - jotform_id: q32_partnerLast32
    label: "שם משפחה (שוכר שני)"
    section: partner
    type: text
    required: never

  - jotform_id: q33_partnerPhone33
    label: "טלפון (שוכר שני)"
    section: partner
    type: phone
    required: never

  - jotform_id: q34_partnerID34
    label: "תעודת זהות (שוכר שני)"
    section: partner
    type: text
