{% extends "dashboard/base.html" %}
{% block title %}{{ t.login_title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto">
  <h1>{{ t.login_title }}</h1>
  {% if error %}<div class="flash flash-err">{{ error }}</div>{% endif %}
  <p class="muted">{{ t.login_hint }}</p>
  <form method="post" action="/dashboard/login">
    <input type="password" name="api_key" placeholder="{{ t.login_key_ph }}"
           autofocus required
           style="width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px">
    <button class="btn btn-primary" type="submit" style="width:100%">{{ t.login_btn }}</button>
  </form>
</div>
{% endblock %}
